[project]
name = "resume-screener"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aio-pika>=10.2.2",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_ai"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # Python style errors
    "F",      # Undefined names and unused imports
    "I",      # Import sorting
    "UP",     # Modern Python syntax
    "B",      # Common bug patterns
    "SIM",    # Simplification suggestions
]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.15.2"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
