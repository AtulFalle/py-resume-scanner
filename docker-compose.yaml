services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: rustfs:9000
      S3_SECURE: "false"
      AI_LLM_BASE_URL: http://host.docker.internal:8080/v1
      AI_LLM_TIMEOUT: "120"
      AI_RESUME_EXTRACTION_MODEL: resume-extractor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rustfs:
        condition: service_started
    restart: unless-stopped
  ui:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: resume-screener-ui
    environment:
      API_BASE_URL: http://api:8000

    command:
      - uv
      - run
      - --no-sync
      - streamlit
      - run
      - src/ui/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"

    ports:
      - "8501:8501"

    depends_on:
      - api

    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: resume-ai-rustfs
    command: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    container_name: resume-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: resume-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  extractor:
    container_name: resume-ai-extractor-job
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: rustfs:9000
      S3_SECURE: "false"
      AI_LLM_BASE_URL: http://host.docker.internal:8080/v1
      AI_LLM_TIMEOUT: "120"
      AI_RESUME_EXTRACTION_MODEL: resume-extractor
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - resume_ai.workers.extractor
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: resume-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  embedding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-ai-embedding
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      AI_EMBEDDING_BASE_URL: http://host.docker.internal:8081/v1
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - resume_ai.workers.embedding
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped



volumes:
  rustfs_data:
  postgres_data:
  qdrant_data:

